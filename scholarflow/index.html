<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScholarFlow AI — 課程學習工作室</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--ink:#18243b;--muted:#52617b;--line:#dbe3f0;--accent:#5146bf;--soft:#eeedff} @media(prefers-color-scheme:dark){:root{--bg:#101523;--panel:#1b2336;--ink:#edf1ff;--muted:#b4c1d8;--line:#37435b;--accent:#a49aff;--soft:#29284a}} *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}header{border-bottom:1px solid var(--line);background:var(--panel);padding:22px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}header strong{font-size:22px;letter-spacing:-.6px}header small{color:var(--muted)}main{max-width:1180px;margin:auto;padding:24px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}section,aside{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}aside{align-self:start}h1,h2,h3,p{margin:0 0 12px}h1{font-size:28px}h2{font-size:19px}h3{font-size:17px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}input,textarea,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);background:var(--panel);max-width:100%}input,textarea,select{width:100%}textarea{resize:vertical}button{cursor:pointer;font-weight:600}button.primary{background:#5146bf;color:#fff;border-color:#5146bf}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.muted,small{color:var(--muted)}.pill{display:inline-block;border-radius:20px;background:var(--soft);padding:3px 10px;color:var(--accent);font-size:13px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.item{border-top:1px solid var(--line);padding:16px 0}.item:first-child{border-top:0}.stat{font-size:26px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);padding:12px;border-radius:12px}.choice{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal}.status{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}a{color:var(--accent)}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header><strong>ScholarFlow <span class="pill">AI V1</span></strong><small>Source-first learning · 無付費 API 原型</small></header>
<main><aside><h2>課程工作區</h2><label for="courses">切換課程</label><select id="courses"></select><div class="bar"><button id="new">新增課程</button></div><form id="courseForm"><label for="name">課程名稱</label><input id="name" required maxlength="120"><label for="school">學校</label><input id="school" maxlength="120"><label for="professor">授課教授</label><input id="professor" maxlength="120"><label for="outline">課程大綱</label><textarea id="outline" rows="5" maxlength="20000"></textarea><label for="material">補充教材（貼上文字）</label><textarea id="material" rows="6" maxlength="80000"></textarea><div class="bar"><button class="primary" type="submit">儲存課程</button></div></form><small>資料僅儲存於本瀏覽器；不會自動同步。請定期匯出成果。不要輸入私人或無權使用的教材。</small></aside>
<div><section><span class="pill">Colab 批次分析</span><h1 id="heading">建立你的課程</h1><p class="muted">匯出任務 → 在 Colab 上傳教材並執行模型 → 匯入分析成果。無模型連線時不會假裝產生 AI 內容。</p><div class="bar"><button id="task" class="primary">匯出分析任務 JSON</button><a href="https://colab.research.google.com/" target="_blank" rel="noopener noreferrer">開啟 Google Colab</a><a href="./scholarflow.ipynb" download>取得分析筆記本</a></div><label for="result">匯入 Colab 產出的結果 JSON</label><input type="file" id="result" accept=".json,application/json"><p id="status" class="status" role="status" aria-live="polite"></p></section>
<section><h2>學習儀表板</h2><div class="metrics"><div class="metric"><small>知識點</small><div id="nNotes" class="stat">0</div></div><div class="metric"><small>已作答</small><div id="nDone" class="stat">0</div></div><div class="metric"><small>最近作答正確率</small><div id="accuracy" class="stat">—</div></div></div><p class="muted" id="meta"></p><div class="bar"><button data-view="notes">分級筆記</button><button data-view="quiz">模擬考題</button><button data-view="mistakes">錯題複習</button><button data-view="prof">教學特徵</button><button id="export">匯出成果與作答 JSON</button><button id="markdown">匯出 Markdown</button></div></section>
<section><h2 id="viewTitle">分級筆記</h2><div id="depthBar" class="bar"><label for="depth">學習深度</label><select id="depth"><option value="summary">快速摘要</option><option value="explanation">深入教學</option><option value="extension">加深加廣（待核實）</option></select></div><div id="content"></div></section></div></main>
<script src="./app.js" defer></script></body></html>
